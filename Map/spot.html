<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港攀岩点采集器 · 真实地图底图</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #1e3a2f; padding: 20px; margin: 0; min-height: 100vh; display: flex; justify-content: center; }
        .app { max-width: 1400px; width: 100%; background: #eaf3ec; border-radius: 36px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1d4e3d; margin: 0 0 4px; font-weight: 600; }
        .sub { color: #2c614b; margin-bottom: 20px; border-left: 6px solid #d97706; padding-left: 18px; }
        .main-row { display: flex; gap: 24px; flex-wrap: wrap; }
        .map-box { flex: 2.2; min-width: 700px; background: #b7cfc2; border-radius: 28px; padding: 16px; box-shadow: inset 0 0 0 1px #8fae9e; }
        .panel { flex: 1.2; min-width: 320px; background: white; border-radius: 28px; padding: 22px; box-shadow: 0 10px 20px rgba(0,20,0,0.05); }
        .canvas-wrapper { border-radius: 20px; overflow: auto; max-height: 70vh; background: #a6bfb1; }
        #mapCanvas { display: block; width: 100%; height: auto; cursor: crosshair; border-radius: 16px; }
        .info-tip { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
        button { background: #1d4e3d; color: white; border: none; border-radius: 40px; padding: 10px 20px; font-weight: 600; cursor: pointer; border: 1px solid #2b735a; transition: 0.15s; font-size: 14px; }
        button:hover { background: #2b6e53; }
        button.secondary { background: #5f6e5e; border-color: #7e947c; }
        .coord-panel { background: #f5faf7; border-radius: 22px; padding: 18px; margin: 18px 0; }
        .field { margin-bottom: 14px; }
        .field label { font-weight: 600; color: #1f4a3c; display: block; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1.5px solid #bdd0c4; font-size: 14px; background: white; }
        .spot-list { max-height: 280px; overflow-y: auto; margin: 16px 0; }
        .spot-item { display: flex; align-items: center; padding: 10px 14px; background: #fafdfb; border-radius: 40px; margin-bottom: 6px; border-left: 8px solid; cursor: pointer; }
        .spot-item .name { flex:1; font-weight: 500; }
        .spot-item .coords { font-size: 12px; color: #4a6a5a; margin-right: 8px; }
        .del-btn { background: none; border: none; color: #b15555; font-size: 18px; cursor: pointer; padding: 4px 8px; }
        textarea { width: 100%; padding: 14px; border-radius: 20px; border: 1.5px solid #b9d5c6; font-family: monospace; font-size: 13px; background: #fcfefc; margin: 16px 0 8px; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; }
    </style>
</head>
<body>
<div class="app">
    <h1>🧭 香港攀岩点位采集器</h1>
    <div class="sub">底图: ../image/map.jpg · 点击地图标记 · 导出spots数组</div>
    
    <div class="main-row">
        <div class="map-box">
            <div class="canvas-wrapper">
                <canvas id="mapCanvas"></canvas>
            </div>
            <div class="info-tip">
                <button id="deleteLastBtn">↩️ 删除最后一点</button>
                <button id="clearAllBtn" class="secondary">🧹 清空所有</button>
                <span style="margin-left: auto; color: #1f4a3c;">👆 点击图片添加标记</span>
            </div>
            <p style="margin:12px 0 4px; font-size:14px; color:#1b4a38;">当前图片尺寸: <span id="imageSizeDisplay">加载中...</span></p>
        </div>
        
        <div class="panel">
            <h3 style="margin-top:0;">📍 当前编辑点</h3>
            <div class="coord-panel">
                <div class="field"><label>X 坐标</label> <input type="number" id="coordX" step="1" readonly></div>
                <div class="field"><label>Y 坐标</label> <input type="number" id="coordY" step="1" readonly></div>
                <div class="field"><label>名称</label> <input type="text" id="spotName" value="新攀岩点" placeholder="例如: 石澳"></div>
                <div class="field"><label>类型</label>
                    <select id="spotType">
                        <option value="natural_boulder">🌿 天然抱石</option>
                        <option value="artificial_boulder">🏢 人工抱石</option>
                        <option value="natural_sport">⛰️ 天然攀登</option>
                        <option value="artificial_sport">🧗 人工攀登</option>
                    </select>
                </div>
                <div class="field"><label>描述</label> <input type="text" id="spotDesc" placeholder="难度/路线数" value="VB-V3"></div>
                <button id="addUpdateBtn" style="width:100%;">➕ 添加 / 更新当前点</button>
                <button id="pickHintBtn" class="secondary" style="width:100%; margin-top:8px;">📍 从地图选取坐标</button>
            </div>
            
            <div style="display:flex; justify-content: space-between; margin:10px 0 5px;">
                <span><strong>📋 已标记点位</strong> (<span id="pointCount">0</span>)</span>
                <span class="legend"><span style="background:#2b6e4f;"></span>抱石 <span style="background:#d97706;"></span>人工抱石 <span style="background:#1e5f8e;"></span>攀登 <span style="background:#b13e6b;"></span>高墙</span>
            </div>
            <div class="spot-list" id="spotListContainer"></div>
            
            <hr style="border-top:2px dashed #b9cfc2;">
            <button id="exportBtn" style="width:100%;">📋 生成并复制 spots 数组</button>
            <textarea id="exportOutput" rows="5" readonly placeholder="点击上方按钮生成数据"></textarea>
        </div>
    </div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        
        // 图片路径
        const MAP_IMAGE_PATH = '../image/map.jpg';
        let mapImage = new Image();
        let imageLoaded = false;
        let imgWidth = 0, imgHeight = 0;
        
        // 采集的点位数组
        let spots = [];
        let selectedIndex = -1;
        
        // DOM 元素
        const coordX = document.getElementById('coordX');
        const coordY = document.getElementById('coordY');
        const spotName = document.getElementById('spotName');
        const spotType = document.getElementById('spotType');
        const spotDesc = document.getElementById('spotDesc');
        const pointCountSpan = document.getElementById('pointCount');
        const spotListDiv = document.getElementById('spotListContainer');
        const exportOutput = document.getElementById('exportOutput');
        const imageSizeDisplay = document.getElementById('imageSizeDisplay');
        
        // 加载图片
        mapImage.crossOrigin = 'Anonymous'; // 避免跨域问题
        mapImage.src = MAP_IMAGE_PATH;
        mapImage.onload = function() {
            imgWidth = mapImage.width;
            imgHeight = mapImage.height;
            canvas.width = imgWidth;
            canvas.height = imgHeight;
            imageLoaded = true;
            imageSizeDisplay.textContent = `${imgWidth} x ${imgHeight} px`;
            redrawCanvas();
        };
        mapImage.onerror = function() {
            alert('错误: 无法加载地图图片 ../image/map.jpg 。请确保图片存在于该路径。');
            imageSizeDisplay.textContent = '图片加载失败';
        };
        
        // 绘制底图 + 标记
        function redrawCanvas() {
            if (!imageLoaded) return;
            ctx.clearRect(0, 0, imgWidth, imgHeight);
            ctx.drawImage(mapImage, 0, 0, imgWidth, imgHeight);
            
            // 绘制标记点
            spots.forEach((spot, idx) => {
                let color = '#2b6e4f';
                if (spot.type === 'artificial_boulder') color = '#d97706';
                else if (spot.type === 'natural_sport') color = '#1e5f8e';
                else if (spot.type === 'artificial_sport') color = '#b13e6b';
                
                const isSelected = (idx === selectedIndex);
                ctx.shadowColor = isSelected ? '#f5e56b' : '#1a2f25';
                ctx.shadowBlur = isSelected ? 16 : 6;
                ctx.beginPath();
                ctx.arc(spot.x, spot.y, isSelected ? 12 : 8, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(spot.x, spot.y, isSelected ? 5 : 3.5, 0, 2 * Math.PI);
                ctx.fillStyle = '#fff9e6';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            });
        }
        
        // 更新右侧列表与表单
        function updateSidebar() {
            pointCountSpan.textContent = spots.length;
            spotListDiv.innerHTML = '';
            spots.forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'spot-item';
                let color = '#2b6e4f';
                if (spot.type === 'artificial_boulder') color = '#d97706';
                else if (spot.type === 'natural_sport') color = '#1e5f8e';
                else if (spot.type === 'artificial_sport') color = '#b13e6b';
                div.style.borderLeftColor = color;
                div.innerHTML = `
                    <span class="name">${spot.name}</span>
                    <span class="coords">(${Math.round(spot.x)}, ${Math.round(spot.y)})</span>
                    <button class="del-btn" data-index="${i}">🗑️</button>
                `;
                div.addEventListener('click', (e) => {
                    if (e.target.classList.contains('del-btn')) return;
                    selectIndex(i);
                });
                spotListDiv.appendChild(div);
            });
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    spots.splice(idx, 1);
                    if (selectedIndex === idx) selectedIndex = -1;
                    else if (selectedIndex > idx) selectedIndex--;
                    redrawCanvas();
                    updateSidebar();
                    clearFormIfNeeded();
                });
            });
            
            if (selectedIndex >= 0 && selectedIndex < spots.length) {
                const s = spots[selectedIndex];
                coordX.value = Math.round(s.x);
                coordY.value = Math.round(s.y);
                spotName.value = s.name;
                spotType.value = s.type;
                spotDesc.value = s.desc || '';
            } else {
                clearForm();
            }
        }
        
        function clearForm() {
            coordX.value = '';
            coordY.value = '';
            spotName.value = '新攀岩点';
            spotDesc.value = '';
        }
        function clearFormIfNeeded() { if (selectedIndex === -1) clearForm(); }
        function selectIndex(idx) { selectedIndex = idx; updateSidebar(); redrawCanvas(); }
        
        // 地图点击：获取坐标并填入表单
        function handleCanvasClick(e) {
            if (!imageLoaded) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = Math.round((e.clientX - rect.left) * scaleX);
            const clickY = Math.round((e.clientY - rect.top) * scaleY);
            coordX.value = clickX;
            coordY.value = clickY;
        }
        
        // 添加/更新
        function addOrUpdate() {
            const x = parseFloat(coordX.value);
            const y = parseFloat(coordY.value);
            if (isNaN(x) || isNaN(y)) { alert('请先点击地图获取坐标'); return; }
            const name = spotName.value.trim() || '未命名';
            const type = spotType.value;
            const desc = spotDesc.value.trim();
            const newSpot = { name, type, x, y, desc };
            
            if (selectedIndex >= 0 && selectedIndex < spots.length) {
                spots[selectedIndex] = newSpot;
            } else {
                spots.push(newSpot);
                selectedIndex = spots.length - 1;
            }
            redrawCanvas();
            updateSidebar();
        }
        
        function pickHint() { alert('请直接在地图上点击，坐标会自动填入上方输入框。'); }
        
        function exportSpots() {
            const exportStr = JSON.stringify(spots, null, 2);
            exportOutput.value = `const spots = ${exportStr};`;
            exportOutput.select();
            document.execCommand('copy');
            alert('✅ spots 数组已复制到剪贴板！');
        }
        
        function deleteLast() { if(spots.length) { spots.pop(); if(selectedIndex>=spots.length) selectedIndex=spots.length-1; redrawCanvas(); updateSidebar(); } }
        function clearAll() { if(confirm('清空所有点位？')) { spots = []; selectedIndex = -1; redrawCanvas(); updateSidebar(); } }
        
        // 初始化绑定
        function init() {
            canvas.addEventListener('click', handleCanvasClick);
            document.getElementById('addUpdateBtn').addEventListener('click', addOrUpdate);
            document.getElementById('pickHintBtn').addEventListener('click', pickHint);
            document.getElementById('exportBtn').addEventListener('click', exportSpots);
            document.getElementById('deleteLastBtn').addEventListener('click', deleteLast);
            document.getElementById('clearAllBtn').addEventListener('click', clearAll);
            
            // 可选预置几个点（如果图片加载后可以手动调整）
            // 但坐标需基于实际图片，故不预设，留给用户自由采集。
            updateSidebar();
        }
        init();
    })();
</script>
</body>
</html>
