<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>天然抱石 · 攀·香港</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box} 
    body{background:black;color:white;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column} 
    body::before{content:"";position:fixed;inset:0;background:url('../image/ClimbingRoute.png') center/cover;opacity:0.8;z-index:0;pointer-events:none;} 
    .top-bar { position:fixed; top:0; left:0; width:100%; height:64px; background:black; color:white; display:flex; align-items:center; justify-content:space-between; padding:0 24px; z-index:200; border-bottom:1px solid #333; }
    .menu-area { position: relative; }
    .menu-dots { font-size: 28px; line-height: 1; cursor: pointer; letter-spacing: 2px; user-select: none; padding: 8px 0; color: white; }
    .nav-dropdown { position: absolute; top: 50px; left: -10px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(8px); border: 1px solid #555; border-radius: 12px; padding: 12px 0; min-width: 180px; display: none; flex-direction: column; box-shadow: 0 8px 20px rgba(0,0,0,0.6); z-index: 220; }
    .nav-dropdown.active { display: flex; }
    .nav-item { padding: 12px 24px; color: #f0f0e0; font-size: 1.1rem; text-decoration: none; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .nav-item:hover { background: #3a5a3a; color: white; }
    .site-title { font-weight:600; font-size:1.4rem; letter-spacing: 2px; }
    .lang-switch { background:#2a2a2a; color:#ddd; border:1px solid #777; padding:6px 14px; border-radius:30px; font-weight:bold; cursor:pointer; font-size: 1rem; transition: 0.2s; user-select: none;}
    .lang-switch:hover { background: #4a6a4a; color: white; border-color: #aaa; }
    .main-content{margin-top:64px;padding:40px 24px 60px;max-width:1100px;margin-inline:auto;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);position:relative;z-index:2;} 
    h1{font-size:3rem;border-left:6px solid #b98c5f;padding-left:20px} h2{font-size:2rem;margin:40px 0 16px;color:#dbb07c} ul,ol{padding-left:24px;line-height:1.7;} table{width:100%;border-collapse:collapse;background:rgba(0,0,0,0.3);margin:24px 0;} th,td{padding:12px;border:1px solid #5a6a5a} th{background:#3a5a3a} .questionnaire{background:rgba(20,30,20,0.9);padding:32px;border-radius:24px;margin-top:48px;border:1px solid #6a8a6a;} .form-group{margin-bottom:20px} label{display:block;margin-bottom:6px} input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #555;color:white;border-radius:8px} button{background:#b98c5f;color:black;font-weight:bold;padding:12px 28px;border:none;border-radius:40px;cursor:pointer}
    p {line-height: 1.7;}
  </style>
</head>
<body>
<header class="top-bar">
  <div class="menu-area">
    <div class="menu-dots" id="menuToggle">⋯</div>
    <div class="nav-dropdown" id="navDropdown">
      <a href="../index.html#section1" class="nav-item" data-lang-key="nav_home">🏔️ 主頁</a>
      <a href="../Map/map.html" class="nav-item" data-lang-key="nav_map">🗺️ 攀岩地圖</a>
      <a href="../index.html#sectionIntro" class="nav-item" data-lang-key="nav_intro">🧗 入門分類</a>
      <a href="../index.html#sectionGear" class="nav-item" data-lang-key="nav_gear">🪢 裝備介紹</a>
      <a href="../history/history.html" class="nav-item" data-lang-key="nav_history">📜 香港攀岩史</a>
    </div>
  </div>
  <div class="site-title" data-lang-key="title">天然抱石</div>
  <div class="lang-switch" id="langToggle">中 / EN</div>
</header>
<main class="main-content">
<h1 data-lang-key="heading">⛰️ 天然抱石<br><span style="font-size:1.6rem;">Natural Bouldering</span></h1>
<div id="contentContainer"></div>
<div class="questionnaire"><h2 data-lang-key="q_title">📋 初學者資訊問卷</h2><form id="beginnerForm"><div class="form-group"><label data-lang-key="q_name">姓名</label><input name="name" required></div><div class="form-group"><label data-lang-key="q_email">電郵</label><input type="email" name="email" required></div><div class="form-group"><label data-lang-key="q_exp">經驗</label><select name="experience"><option>N/A</option><option>>3month</option><option>3-12month</option><option>>1year</option></select></div><div class="form-group"><label data-lang-key="q_goal">目標</label><textarea name="goal"></textarea></div><button type="submit" data-lang-key="q_submit">提交</button></form></div>
</main>
<script>
(function(){
  // 廣東話註釋：天然抱石頁面 script，結構同上

  const dict = {
    zh:{ 
      nav_home: '🏔️ 主頁', nav_map: '🗺️ 攀岩地圖', nav_intro: '🧗 入門分類', 
      nav_gear: '🪢 裝備介紹', nav_history: '📜 香港攀岩史', title:'天然抱石',
      heading:'⛰️ 天然抱石', intro_title:'定義',
      intro_text:'天然抱石在戶外岩石上進行，高度低於5米，使用抱石墊保護。無繩索，強調讀線與純粹攀登。', 
      gear_title:'裝備', gear_items:['攀岩鞋','鎂粉','抱石墊','彈性繃帶'], 
      tips_title:'技巧', tips_items:['熱身手指','檢查落地區','確保下撤','夥伴確保'], 
      grade_title:'難度', grade_table:[['V0','4','初學'],['V1','5','初階'],['V2','5+','初階'],['V3','6A','中階'],['V4','6A+','中階']],
      q_title:'問卷', q_name:'姓名', q_email:'電郵', q_exp:'經驗', q_goal:'目標', q_submit:'提交'
    },
    en:{ 
      nav_home: '🏔️ Home', nav_map: '🗺️ Map', nav_intro: '🧗 Categories', 
      nav_gear: '🪢 Gear', nav_history: '📜 History', title:'Natural Bouldering',
      heading:'⛰️ Natural Bouldering', intro_title:'Definition',
      intro_text:'Outdoor bouldering on real rock, under 5m, protected by crash pads. Pure, no ropes.', 
      gear_title:'Gear', gear_items:['Shoes','Chalk','Crash pad','Tape'], 
      tips_title:'Tips', tips_items:['Warm up fingers','Check landing','Plan descent','Spotting'], 
      grade_title:'Grades', grade_table:[['V0','4','Beginner'],['V1','5','Novice'],['V2','5+','Novice'],['V3','6A','Intermediate'],['V4','6A+','Intermediate']],
      q_title:'Questionnaire', q_name:'Name', q_email:'Email', q_exp:'Experience', q_goal:'Goal', q_submit:'Submit'
    }
  };
  
  let lang = localStorage.getItem('climb_lang') || 'zh'; 
  const cont = document.getElementById('contentContainer');
  
  function render(l){
    const d=dict[l]; 
    let h=`<h2>${d.intro_title}</h2><p>${d.intro_text}</p><h2>${d.gear_title}</h2><ul>${d.gear_items.map(i=>'<li>'+i+'</li>').join('')}</ul><h2>${d.tips_title}</h2><ul>${d.tips_items.map(i=>'<li>'+i+'</li>').join('')}</ul><h2>${d.grade_title}</h2><table><tr><th>V</th><th>🇫🇷</th><th>描述</th></tr>`;
    d.grade_table.forEach(r=>{ h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`; }); 
    h+='</table>'; 
    cont.innerHTML=h;
    document.querySelectorAll('[data-lang-key]').forEach(el=>{ const k=el.dataset.langKey; if(d[k]) el.textContent=d[k]; });
  }
  
  render(lang);
  document.getElementById('langToggle').textContent = lang === 'zh' ? '中 / EN' : 'EN / 中';
  document.getElementById('langToggle').onclick=()=>{ 
    lang=lang==='zh'?'en':'zh'; 
    localStorage.setItem('climb_lang', lang); 
    render(lang); 
    document.getElementById('langToggle').textContent=lang==='zh'?'中 / EN':'EN / 中'; 
  };
  
  const menuToggle = document.getElementById('menuToggle');
  const navDropdown = document.getElementById('navDropdown');
  menuToggle.addEventListener('click', (e) => { e.stopPropagation(); navDropdown.classList.toggle('active'); });
  document.addEventListener('click', (e) => { if (!menuToggle.contains(e.target) && !navDropdown.contains(e.target)) navDropdown.classList.remove('active'); });

  document.getElementById('beginnerForm').onsubmit=e=>{ e.preventDefault(); alert('Thanks!'); };
})();
</script>
</body>
</html>
