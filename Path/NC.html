<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>天然攀登 · 攀·香港</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="with-bg">
<header class="top-bar">
  <div class="menu-area">
    <div class="menu-dots" id="menuToggle">⋯</div>
    <div class="nav-dropdown" id="navDropdown">
      <a href="../index.html#section1" class="nav-item" data-lang-key="nav_home">🏔️ 主頁</a>
      <a href="../Map/map.html" class="nav-item" data-lang-key="nav_map">🗺️ 攀岩地圖</a>
      <a href="../index.html#sectionIntro" class="nav-item" data-lang-key="nav_intro">🧗 入門分類</a>
      <a href="../index.html#sectionGear" class="nav-item" data-lang-key="nav_gear">🪢 裝備介紹</a>
      <a href="../history/history.html" class="nav-item" data-lang-key="nav_history">📜 香港攀岩史</a>
    </div>
  </div>
  <div class="site-title" data-lang-key="title">天然攀登</div>
  <div class="lang-switch" id="langToggle">中 / EN</div>
</header>
<main class="main-content">
<h1 data-lang-key="heading">🏔️ 天然攀登<br><span style="font-size:1.6rem;">Natural / Trad Climbing</span></h1>
<div id="contentContainer"></div>
<div class="questionnaire"><h2 data-lang-key="q_title">📋 初學者資訊問卷</h2><form id="beginnerForm"><div class="form-group"><label data-lang-key="q_name">姓名</label><input name="name"></div><div class="form-group"><label data-lang-key="q_email">電郵</label><input type="email" name="email"></div><div class="form-group"><label data-lang-key="q_exp">經驗</label><select name="experience"><option>N/A</option><option>>3month</option><option>3-12month</option><option>>1year</option></select></div><div class="form-group"><label data-lang-key="q_goal">目標</label><textarea name="goal"></textarea></div><button type="submit" data-lang-key="q_submit">提交</button></form></div>
</main>
<script>
(function(){
  // 廣東話註釋：天然攀登頁面 script

  const dict = {
    zh:{ 
      nav_home: '🏔️ 主頁', nav_map: '🗺️ 攀岩地圖', nav_intro: '🧗 入門分類', 
      nav_gear: '🪢 裝備介紹', nav_history: '📜 香港攀岩史', title:'天然攀登',
      heading:'🏔️ 天然攀登', intro_title:'定義',
      intro_text:'天然攀登在戶外岩壁上進行，使用繩索確保。傳統攀登需自行放置保護支點。高度不限，考驗技術與心理。', 
      gear_title:'裝備', gear_items:['安全帶','頭盔','繩索','岩楔/機械塞','快掛','確保器'], 
      tips_title:'技巧', tips_items:['從5.5-5.7開始','學習放置保護','結伴確保'], 
      grade_title:'難度', grade_table:[['5.5','3','入門'],['5.6','4+','新手'],['5.7','5','新手'],['5.8','5+','中階'],['5.9','6a','中階']],
      q_title:'問卷', q_name:'姓名', q_email:'電郵', q_exp:'經驗', q_goal:'目標', q_submit:'提交'
    },
    en:{ 
      nav_home: '🏔️ Home', nav_map: '🗺️ Map', nav_intro: '🧗 Categories', 
      nav_gear: '🪢 Gear', nav_history: '📜 History', title:'Natural Climbing',
      heading:'🏔️ Natural Climbing', intro_title:'Definition',
      intro_text:'Outdoor rock climbing with ropes. Trad climbing requires placing removable protection. Demands technique and mental strength.', 
      gear_title:'Gear', gear_items:['Harness','Helmet','Rope','Cams/Nuts','Quickdraws','Belay device'], 
      tips_title:'Tips', tips_items:['Start 5.5-5.7','Learn gear placement','Climb with partner'], 
      grade_title:'Grades', grade_table:[['5.5','3','Beginner'],['5.6','4+','Novice'],['5.7','5','Novice'],['5.8','5+','Intermediate'],['5.9','6a','Intermediate']],
      q_title:'Questionnaire', q_name:'Name', q_email:'Email', q_exp:'Experience', q_goal:'Goal', q_submit:'Submit'
    }
  };
  
  let lang = localStorage.getItem('climb_lang') || 'zh'; 
  const cont = document.getElementById('contentContainer');
  
  function render(l){
    const d=dict[l]; 
    let h=`<h2>${d.intro_title}</h2><p>${d.intro_text}</p><h2>${d.gear_title}</h2><ul>${d.gear_items.map(i=>'<li>'+i+'</li>').join('')}</ul><h2>${d.tips_title}</h2><ul>${d.tips_items.map(i=>'<li>'+i+'</li>').join('')}</ul><h2>${d.grade_title}</h2></table><tr><th>YDS</th><th>🇫🇷</th><th>描述</th></tr>`;
    d.grade_table.forEach(r=>{ h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`; }); 
    h+='</table>'; 
    cont.innerHTML=h;
    document.querySelectorAll('[data-lang-key]').forEach(el=>{ const k=el.dataset.langKey; if(d[k]) el.textContent=d[k]; });
  }
  
  render(lang);
  document.getElementById('langToggle').textContent = lang === 'zh' ? '中 / EN' : 'EN / 中';
  document.getElementById('langToggle').onclick=()=>{ 
    lang=lang==='zh'?'en':'zh'; 
    localStorage.setItem('climb_lang', lang); 
    render(lang); 
    document.getElementById('langToggle').textContent=lang==='zh'?'中 / EN':'EN / 中'; 
  };

  const menuToggle = document.getElementById('menuToggle');
  const navDropdown = document.getElementById('navDropdown');
  menuToggle.addEventListener('click', (e) => { e.stopPropagation(); navDropdown.classList.toggle('active'); });
  document.addEventListener('click', (e) => { if (!menuToggle.contains(e.target) && !navDropdown.contains(e.target)) navDropdown.classList.remove('active'); });

  document.getElementById('beginnerForm').onsubmit=e=>{ e.preventDefault(); alert('Thanks!'); };
})();
</script>
</body>
</html>
