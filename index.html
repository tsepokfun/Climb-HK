<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>攀 · 香港</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="menu-area">
    <div class="menu-dots" id="menuToggle">⋯</div>
    <div class="nav-dropdown" id="navDropdown">
      <a href="#section1" class="nav-item" data-lang-key="nav_home">🏔️ 主頁</a>
      <a href="Map/map.html" class="nav-item" data-lang-key="nav_map">🗺️ 攀岩地圖</a>
      <a href="#sectionIntro" class="nav-item" data-lang-key="nav_intro">🧗 入門分類</a>
      <a href="#sectionGear" class="nav-item" data-lang-key="nav_gear">🪢 裝備介紹</a>
      <a href="history/history.html" class="nav-item" data-lang-key="nav_history">📜 香港攀岩史</a>
    </div>
  </div>
  <div class="site-title" data-lang-key="site_title">香港攀岩</div>
  <div class="lang-switch" id="langToggle">中 / EN</div>
</header>

<div class="rope-progress">
  <div class="rope-line" id="ropeLine">
    <div class="climber-icon" id="climberIcon" style="top: 0%;"></div>
  </div>
</div>

<div class="scroll-container">
  <section class="section hero-section" id="section1">
    <div class="hero-title">
      <!-- 中文版：書法圖片 -->
      <div id="heroZh" style="display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; flex-wrap: wrap;">
        <img src="image/Climb.png" alt="攀" class="hero-img-pan">
        <div class="hero-img-hk">
          <img src="image/Hong.png" alt="香">
          <img src="image/Kong.png" alt="港">
        </div>
      </div>
      
      <!-- 英文版：型格 CSS 字體 (模擬原圖排版) -->
      <div id="heroEn" style="display: none; align-items: center; justify-content: center; gap: 20px; width: 100%; flex-wrap: wrap;">
        <!-- 鏤空特效大字 -->
        <div style="font-family: 'Impact', 'Arial Black', sans-serif; font-size: clamp(80px, 12vw, 180px); font-weight: 900; color: transparent; -webkit-text-stroke: 2px #f0f0e0; text-transform: uppercase; letter-spacing: 5px; text-shadow: 8px 8px 15px rgba(0,0,0,0.8); line-height: 1;">
          CLIMB
        </div>
        <!-- 垂直金色小字 -->
        <div style="display: flex; flex-direction: column; align-items: center; font-family: 'Impact', 'Arial Black', sans-serif; font-size: clamp(50px, 7vw, 100px); font-weight: 900; color: #dbb07c; line-height: 0.9; text-shadow: 6px 6px 12px rgba(0,0,0,0.8);">
          <span>H</span><span>K</span>
        </div>
      </div>
    </div>
    <div class="scroll-hint" id="scrollHint">
      <span>⌃</span><span data-lang-key="scroll_up">向上滑動</span>
    </div>
  </section>

  <section class="section bg-climb-route fade-section" id="sectionMap">
    <h2 class="section-title" data-lang-key="map_title">🧗 攀石好去處</h2>
    <div class="map-container" id="mapClickArea" style="height: 400px; padding: 0; position: relative; overflow: hidden; border-radius: 28px;">
      <div id="home-map" style="width: 100%; height: 100%;"></div>
      <div style="position: absolute; inset: 0; z-index: 10; cursor: pointer;" id="homeMapOverlay"></div>
    </div>
    <p style="margin-top: 20px; opacity:0.9;" data-lang-key="map_click">點擊地圖進入搜尋頁面</p>
  </section>  

  <section class="section bg-climb-route fade-section" id="sectionIntro">
    <h2 class="section-title" data-lang-key="intro_title">選擇你的入門路線</h2>
    <div class="intro-grid">
      <div class="intro-card" style="background-image: url('image/AB.jpg');" data-goto="Path/AB.html"><span data-lang-key="cat_ab">🧗‍♂️ 人工抱石</span></div>
      <div class="intro-card" style="background-image: url('image/AC.jpg');" data-goto="Path/AC.html"><span data-lang-key="cat_ac">🧗 人工攀岩</span></div>
      <div class="intro-card" style="background-image: url('image/NB.jpg');" data-goto="Path/NB.html"><span data-lang-key="cat_nb">⛰️ 戶外抱石</span></div>
      <div class="intro-card" style="background-image: url('image/NC.jpg');" data-goto="Path/NC.html"><span data-lang-key="cat_nc">🏔️ 戶外攀岩</span></div>
    </div>
  </section>

  <section class="section bg-climb-route fade-section" id="sectionGear">
    <h2 class="section-title" data-lang-key="gear_title">攀登裝備</h2>
    <div class="gear-wrapper">
      <div class="gear-canvas-box">
        <canvas id="gearCanvas"></canvas>
      </div>
      <div class="gear-hint" data-lang-key="gear_click">點擊裝備或名稱查看詳情</div>
    </div>
  </section>

  <section class="section bg-climb-route fade-section history-section" id="sectionHistory">
    <div class="history-placeholder">
      <span data-lang-key="history_main">📜 香港攀岩歷史</span><br>
      <span style="font-size: 1.2rem;" data-lang-key="history_click">(點擊進入詳細歷史)</span>
    </div>
  </section>
</div>

<footer class="footer-bar" id="mainFooter">
  <div>攀・香港 | <a href="https://github.com/tsepokfun/Climb-HK">GitHub</a> | <a data-lang-key="footer_copyright">版權聲明</a> | <span data-lang-key="footer_contact">聯絡我們</span></div>
  <div style="margin-top: 10px;" data-lang-key="footer_note">網站設計・僅供攀岩愛好者參考</div>
</footer>

<script src="js/spots-data.js"></script>
<script>
  const spots = SPOTS_DATA.spots;

  function getCategoryColor(typeCode) {
      const colors = { 'NB': '#3a5a3a', 'AB': '#2d5a7b', 'NC': '#8a5a3a', 'AC': '#5a3a7b' };
      return colors[typeCode] || '#ff0000';
  }

  window.initHomeMap = function() {
      const homeMap = new google.maps.Map(document.getElementById('home-map'), {
          center: { lat: 22.31, lng: 114.18 },
          zoom: 11,
          mapTypeId: 'satellite',
          tilt: 45,
          disableDefaultUI: true,
          gestureHandling: 'none'
      });

      spots.forEach(spot => {
          new google.maps.Marker({
              position: { lat: spot.lat, lng: spot.lng },
              map: homeMap,
              icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  fillColor: getCategoryColor(spot.typeCode),
                  fillOpacity: 0.9,
                  strokeColor: 'white',
                  strokeWeight: 2,
                  scale: 6
              }
          });
      });
  };

  document.getElementById('homeMapOverlay').addEventListener('click', () => { 
      window.location.href = 'Map/map.html'; 
  });
  
  (function(){
    "use strict";

    let currentLang = 'zh'

    const langDict = {
      zh: {
        site_title: '香港攀岩', nav_home: '🏔️ 主頁', nav_map: '🗺️ 攀岩地圖', nav_intro: '🧗 入門分類', nav_gear: '🪢 裝備介紹', nav_history: '📜 香港攀岩史',
        scroll_up: '向上滑動', map_title: '🧗 攀石好去處', map_click: '點擊地圖進入搜尋頁面', intro_title: '選擇你的入門路線',
        cat_ab: '🧗‍♂️ 人工抱石', cat_ac: '🧗 人工攀岩', cat_nb: '⛰️ 戶外抱石', cat_nc: '🏔️ 戶外攀岩',
        gear_title: '攀登裝備', gear_click: '點擊裝備或名稱查看詳情', gear_rope_label: '繩索',
        history_main: '📜 香港攀岩歷史', history_click: '(點擊進入詳細歷史)',
        footer_brand: '攀・香港', footer_copyright: '版權聲明', footer_contact: '聯絡我們', footer_note: '網站設計・僅供攀岩愛好者參考'
      },
      en: {
        site_title: 'HK Climbing', nav_home: '🏔️ Home', nav_map: '🗺️ Climbing Map', nav_intro: '🧗 Categories', nav_gear: '🪢 Gear', nav_history: '📜 History',
        scroll_up: 'Scroll Up', map_title: '🧗 Climbing Spots', map_click: 'Click map to search', intro_title: 'Choose Your Path',
        cat_ab: '🧗‍♂️ Gym Bouldering', cat_ac: '🧗 Gym Climbing', cat_nb: '⛰️ Outdoor Bouldering', cat_nc: '🏔️ Outdoor Climbing',
        gear_title: 'Climbing Gear', gear_click: 'Click gear or label for details', gear_rope_label: 'Rope',
        history_main: '📜 HK Climbing History', history_click: '(Click for detailed history)',
        footer_brand: 'Climb HK', footer_copyright: 'Copyright', footer_contact: 'Contact', footer_note: 'Website for climbing enthusiasts'
      }
    };

    const gearCanvas = document.getElementById('gearCanvas');
    const gearCtx = gearCanvas.getContext('2d');
    gearCanvas.width = 900;
    gearCanvas.height = 550;
    const hitRegions = [];     

    const scrollHint = document.getElementById('scrollHint');
    const climberIcon = document.getElementById('climberIcon');
    const langToggle = document.getElementById('langToggle');
    const menuToggle = document.getElementById('menuToggle');
    const navDropdown = document.getElementById('navDropdown');
    const heroZh = document.getElementById('heroZh');
    const heroEn = document.getElementById('heroEn');

    function drawGearScene() {
      gearCtx.clearRect(0, 0, gearCanvas.width, gearCanvas.height);
      hitRegions.length = 0;   

      gearCtx.shadowColor = '#1a1a1a'; gearCtx.shadowBlur = 10;
      gearCtx.fillStyle = '#b5875a'; gearCtx.fillRect(480, 20, 30, 230);
      gearCtx.fillStyle = '#9c7a4d'; for (let i=25; i<250; i+=12) { gearCtx.fillRect(480, i, 30, 4); }
      gearCtx.fillStyle = '#dbb07c'; gearCtx.globalAlpha = 0.5; gearCtx.fillRect(485, 20, 8, 230);
      gearCtx.globalAlpha = 1.0; gearCtx.shadowBlur = 0;

      gearCtx.fillStyle = '#f7d9aa'; gearCtx.beginPath(); gearCtx.arc(400, 75, 28, 0, 2*Math.PI); gearCtx.fill();
      gearCtx.strokeStyle = '#6b4f2c'; gearCtx.lineWidth = 2; gearCtx.stroke();
      
      gearCtx.fillStyle = '#4f7a9e';
      gearCtx.fillRect(365, 105, 70, 90); gearCtx.fillRect(315, 115, 45, 18);
      gearCtx.fillRect(440, 115, 45, 18); gearCtx.fillRect(355, 200, 22, 65); gearCtx.fillRect(423, 200, 22, 65);
      
      gearCtx.fillStyle = '#d63e3e'; gearCtx.beginPath(); gearCtx.arc(400, 65, 32, Math.PI, 2*Math.PI); gearCtx.fill();
      
      gearCtx.fillStyle = '#b05e2e';
      gearCtx.beginPath(); gearCtx.moveTo(345, 265); gearCtx.lineTo(375, 265); gearCtx.lineTo(382, 285); gearCtx.lineTo(338, 285); gearCtx.closePath(); gearCtx.fill();
      gearCtx.beginPath(); gearCtx.moveTo(415, 265); gearCtx.lineTo(445, 265); gearCtx.lineTo(452, 285); gearCtx.lineTo(408, 285); gearCtx.closePath(); gearCtx.fill();

      gearCtx.fillStyle = '#2e5c6b';
      gearCtx.fillRect(345, 180, 110, 12); gearCtx.fillRect(345, 200, 18, 40); gearCtx.fillRect(437, 200, 18, 40);
      gearCtx.fillRect(385, 180, 10, 55); gearCtx.fillRect(405, 180, 10, 55);
      
      gearCtx.fillStyle = '#7a8f8c'; gearCtx.beginPath(); gearCtx.arc(400, 150, 15, 0, 2*Math.PI); gearCtx.fill();
      gearCtx.fillStyle = '#a0b0a8'; gearCtx.beginPath(); gearCtx.arc(412, 143, 12, 0, 2*Math.PI); gearCtx.fill();
      
      gearCtx.fillStyle = '#bd7a5a';
      gearCtx.fillRect(295, 115, 25, 20); gearCtx.fillRect(285, 122, 14, 10);
      gearCtx.fillRect(470, 115, 25, 20); gearCtx.fillRect(490, 122, 14, 10);
      
      const isEn = currentLang === 'en';

      const labels =[
        { zh: '頭盔', en: 'Helmet', x: 160, y: 90, cx: 365, cy: 65, url: 'gear/gear.html?type=helmet' },
        { zh: '攀石鞋', en: 'Shoes', x: 120, y: 270, cx: 350, cy: 270, url: 'gear/gear.html?type=shoes' },
        { zh: '安全帶', en: 'Harness', x: 580, y: 200, cx: 455, cy: 190, url: 'gear/gear.html?type=harness' },
        { zh: '確保器', en: 'Belay', x: 660, y: 140, cx: 425, cy: 145, url: 'gear/gear.html?type=belay' },
        { zh: '手套', en: 'Gloves', x: 560, y: 100, cx: 480, cy: 120, url: 'gear/gear.html?type=gloves' },
        { zh: '繩索', en: 'Rope', x: 520, y: 30, cx: 500, cy: 50, url: 'gear/gear.html?type=rope' }
      ];
      
      gearCtx.font = 'bold 18px system-ui, sans-serif'; gearCtx.fillStyle = '#f5f0dc';
      gearCtx.strokeStyle = '#cdc6a5'; gearCtx.lineWidth = 2;
      
      labels.forEach(item => {
        gearCtx.beginPath(); gearCtx.moveTo(item.cx, item.cy); gearCtx.lineTo(item.x + 50, item.y - 5); gearCtx.stroke();
        const name = isEn ? item.en : item.zh;
        const textW = gearCtx.measureText(name).width;
        const textRect = { x: item.x, y: item.y-24, w: textW+16, h: 32 };
        gearCtx.fillStyle = '#2b3b2b'; gearCtx.fillRect(textRect.x, textRect.y, textRect.w, textRect.h);
        gearCtx.fillStyle = '#f0eac1'; gearCtx.fillText(name, item.x+8, item.y);
        hitRegions.push({ rect:[textRect.x, textRect.y, textRect.w, textRect.h], url: item.url });
      });
      
      hitRegions.push({ rect:[360,35,80,40], url:'gear/gear.html?type=helmet' });
      hitRegions.push({ rect:[335,255,120,35], url:'gear/gear.html?type=shoes' });
      hitRegions.push({ rect:[340,175,130,70], url:'gear/gear.html?type=harness' });
      hitRegions.push({ rect:[385,130,45,40], url:'gear/gear.html?type=belay' });
      hitRegions.push({ rect:[280,105,80,40], url:'gear/gear.html?type=gloves' });
    }

    function applyLanguage(lang) {
      currentLang = lang;
      
      // 切換主視覺 (中文書法 vs 英文型格字體)
      if (heroZh && heroEn) {
        if (lang === 'en') {
          heroZh.style.display = 'none';
          heroEn.style.display = 'flex';
        } else {
          heroZh.style.display = 'flex';
          heroEn.style.display = 'none';
        }
      }

      document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.getAttribute('data-lang-key');
        if (langDict[lang] && langDict[lang][key]) { el.textContent = langDict[lang][key]; }
      });
      drawGearScene();  
    }

    function updateProgressAndEffects() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      let percent = docHeight > 0 ? scrollTop / docHeight : 0;
      percent = Math.min(1, Math.max(0, percent));
      if (climberIcon) climberIcon.style.top = (percent * 100) + '%';
      
      if (scrollHint) {
        scrollHint.style.opacity = scrollTop > 80 ? '0' : '0.8';
        scrollHint.style.pointerEvents = scrollTop > 80 ? 'none' : 'auto';
      }

      document.querySelectorAll('.fade-section').forEach(section => {
        const rect = section.getBoundingClientRect();
        const wh = window.innerHeight;
        let opacity = 1;
        if (rect.bottom < wh * 0.3) opacity = 0.1;
        else if (rect.top > wh * 0.7) opacity = 0.2;
        else opacity = 1;
        section.style.opacity = opacity;
      });

      const gearSection = document.getElementById('sectionGear');
      if (gearCanvas && gearSection) {
        const rect = gearSection.getBoundingClientRect();
        const viewportMid = window.innerHeight / 2;
        const distance = Math.abs(rect.top + rect.height/2 - viewportMid);
        const scale = 1.0 + 0.15 * Math.max(0, 1 - distance / window.innerHeight);
        gearCanvas.style.transform = `scale(${scale})`;
        gearCanvas.style.transformOrigin = 'center center';
        const shiftX = (rect.left + rect.width/2 - window.innerWidth/2) * 0.02;
        gearCanvas.style.translate = `${-shiftX}px 0`;
      }
    }

    // ---------- 初始化：自動偵測語言與綁定事件 ----------
    let savedLang = localStorage.getItem('climb_lang');
    
    // 如果使用者沒有設定過語言，自動偵測瀏覽器語言
    if (!savedLang) {
      const browserLang = navigator.language || navigator.userLanguage;
      // 如果瀏覽器語言不是以 'zh' (中文) 開頭，就預設為英文 'en'
      if (browserLang && !browserLang.toLowerCase().startsWith('zh')) {
        savedLang = 'en';
      } else {
        savedLang = 'zh';
      }
      localStorage.setItem('climb_lang', savedLang);
    }

    langToggle.textContent = savedLang === 'zh' ? '中 / EN' : 'EN / 中';
    applyLanguage(savedLang); 
    updateProgressAndEffects();

    langToggle.addEventListener('click', () => {
      const newLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('climb_lang', newLang);
      langToggle.textContent = newLang === 'zh' ? '中 / EN' : 'EN / 中';
      applyLanguage(newLang);
    });

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation(); navDropdown.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!menuToggle.contains(e.target) && !navDropdown.contains(e.target)) navDropdown.classList.remove('active');
    });
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => { navDropdown.classList.remove('active'); });
    });

    document.querySelectorAll('.intro-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const goto = card.dataset.goto;
        if(goto) window.location.href = goto;
      });
    });

    gearCanvas.addEventListener('click', (e) => {
      const rect = gearCanvas.getBoundingClientRect();
      const scaleX = gearCanvas.width / rect.width;
      const scaleY = gearCanvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      for (let r of hitRegions) {
        const [rx, ry, rw, rh] = r.rect;
        if (mouseX >= rx && mouseX <= rx+rw && mouseY >= ry && mouseY <= ry+rh) {
          window.location.href = r.url;
          break;
        }
      }
    });

    document.getElementById('sectionHistory').addEventListener('click', ()=> window.location.href='history/history.html');
    document.getElementById('mainFooter').addEventListener('click', (e)=> e.stopPropagation());
    
    window.addEventListener('scroll', updateProgressAndEffects);
    window.addEventListener('resize', ()=> { drawGearScene(); updateProgressAndEffects(); });

  })();
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDPx9XDTysD9oC4QKhVQg707BPuGK3c5HY&callback=initHomeMap" async defer></script>

</body>
</html>
