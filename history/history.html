            { year: '2023', desc: '香港已有 25 個天然攀岩場地，超過 700 條路線。抱石場地數量持續增長，消費者委員會就安全問題發出指引。' },
            { year: '2025', desc: '香港抱石錦標賽於九龍公園舉行，陳翔志再度衛冕男子公開組冠軍。' }

      },
      en: {

        era_1950s: '1950s — Beginnings', era_1960s: '1960s — First Guidebook', era_1970s: '1970s — Going Public',

    let currentLang = 'zh';  // 當前語言，預設中文

    // ---------- 2. 渲染時間線 (timeline) ----------
    // 廣東話註釋：根據 dictionary 嘅 events data 動態生成 HTML，
    // 按照年代順序 (1950s -> 1960s -> ...) 排列，每個年代下面顯示對應嘅 event cards
    function renderTimeline(lang) {
      const container = document.getElementById('timelineContainer');
      const dict = langDict[lang];
      const eventsData = dict.events;
      const eraOrder = ['1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
      
      let html = '';
      for (let era of eraOrder) {
        if (!eventsData[era]) continue;
        const eraTitle = dict[`era_${era}`] || era;
        html += `<div class="era">${eraTitle}</div>`;
        eventsData[era].forEach(ev => {
          html += `<div class="event-card"><div class="event-year">${ev.year}</div><div class="event-desc">${ev.desc}</div></div>`;
        });
      }
      container.innerHTML = html;
    }

    // ---------- 3. 套用語言 (apply language) ----------
    // 廣東話註釋：更新所有 [data-lang-key] 嘅文字內容，
    // 同埋重新生成 timeline（因為入面啲文字都要轉語言）
    function applyLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.getAttribute('data-lang-key');
        if (langDict[lang] && langDict[lang][key]) { el.textContent = langDict[lang][key]; }
      });
      renderTimeline(lang);  // 重新生成 timeline
      document.body.className = `lang-${lang}`;
    }

    // ---------- 4. Menu dropdown 邏輯 ----------
    const menuToggle = document.getElementById('menuToggle');
    const navDropdown = document.getElementById('navDropdown');
    menuToggle.addEventListener('click', (e) => { 
      e.stopPropagation(); 
      navDropdown.classList.toggle('active');  // toggle 開關 dropdown menu
    });
    document.addEventListener('click', (e) => { 
      if (!menuToggle.contains(e.target) && !navDropdown.contains(e.target)) {
        navDropdown.classList.remove('active');  // 禁其他地方就收埋 dropdown
      }
    });

    // ---------- 5. 語言切換 button handler ----------
    const langToggle = document.getElementById('langToggle');
    const savedLang = localStorage.getItem('climb_lang') || 'zh';
    applyLanguage(savedLang);
    langToggle.textContent = savedLang === 'zh' ? '中 / EN' : 'EN / 中';

    langToggle.addEventListener('click', () => {
      const newLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('climb_lang', newLang);  // 儲存去 localStorage，下次入嚟會記住
      applyLanguage(newLang);
      langToggle.textContent = newLang === 'zh' ? '中 / EN' : 'EN / 中';
    });
  })();
</script>
</body>
</html>
