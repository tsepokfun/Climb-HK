name: CI

# Zero-dependency project: no install step is needed.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 1'  # Weekly health check: Monday 01:00 UTC (09:00 HKT)

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: test
        run: node --test tests/*.test.mjs

      - name: validate spots data
        run: node tools/validate-spots.mjs

      - name: qa cases
        run: node qa/run-all.mjs