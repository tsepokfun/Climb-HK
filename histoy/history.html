<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>香港攀岩歷史 · 攀·香港</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: black;
      color: white;
      font-family: system-ui, -apple-system, 'Helvetica Neue', 'Noto Sans HK', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 繼承主站頂欄 */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background-color: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid #333;
    }

    .menu-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      color: #ccc;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 30px;
      background: #222;
      transition: 0.2s;
      border: 1px solid #444;
    }

    .back-link:hover {
      background: #3a5a3a;
      color: white;
    }

    .site-title {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    .lang-switch {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #777;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    .lang-switch:hover {
      background: #4a6a4a;
      color: white;
      border-color: #aaa;
    }

    /* 主要內容區域 */
    .main-content {
      margin-top: 64px;
      padding: 40px 24px 60px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      min-height: calc(100vh - 64px);
      position: relative;
      z-index: 1;
    }

    /* 背景圖層 (模擬主站氛圍) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('../image/ClimbingRoute.png');
      background-size: cover;
      background-position: center;
      opacity: 0.2;
      z-index: 0;
      pointer-events: none;
    }

    h1 {
      font-size: 3.2rem;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 4px;
      border-left: 6px solid #b98c5f;
      padding-left: 24px;
      text-shadow: 2px 2px 8px black;
    }

    .subhead {
      font-size: 1.2rem;
      margin-bottom: 40px;
      opacity: 0.9;
      color: #ccc;
    }

    /* 時間線容器 */
    .timeline {
      position: relative;
      margin: 40px 0;
    }

    /* 年代標題 */
    .era {
      margin-top: 48px;
      margin-bottom: 16px;
      font-size: 2.4rem;
      font-weight: 700;
      color: #dbb07c;
      border-bottom: 2px solid #5a6a5a;
      padding-bottom: 8px;
    }

    .era:first-of-type {
      margin-top: 0;
    }

    /* 事件卡片 */
    .event-card {
      background: rgba(20, 25, 20, 0.8);
      backdrop-filter: blur(4px);
      border-left: 6px solid #b98c5f;
      margin-bottom: 20px;
      padding: 20px 28px;
      border-radius: 0 16px 16px 0;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateX(6px);
      background: rgba(40, 50, 40, 0.9);
    }

    .event-year {
      font-size: 1.8rem;
      font-weight: 700;
      color: #e0c090;
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .event-year small {
      font-size: 1rem;
      font-weight: 400;
      color: #aaa;
    }

    .event-desc {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f0f0e0;
    }

    /* 數據表格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 48px;
      background: rgba(30,35,30,0.7);
      padding: 28px;
      border-radius: 24px;
      backdrop-filter: blur(4px);
      border: 1px solid #5a7a5a;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2.8rem;
      font-weight: 800;
      color: #dbb07c;
    }

    .stat-label {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bbb;
    }

    .footer-note {
      margin-top: 48px;
      text-align: right;
      color: #aaa;
      font-style: italic;
      border-top: 1px solid #3a4a3a;
      padding-top: 24px;
    }

    /* 語言切換時的文字調整 */
    .lang-en .event-desc,
    .lang-zh .event-desc {
      /* 由js控制 */
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.4rem; }
      .event-year { font-size: 1.5rem; flex-wrap: wrap; }
      .main-content { padding: 20px 16px; }
    }
  </style>
</head>
<body class="lang-zh">

<!-- 固定頂欄 (與主站一致) -->

  <div id="timelineContainer" class="timeline"></div>

    </div>

      <div class="stat-label" data-lang-key="stat_boulders">抱石路線</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">14</div>
      <div class="stat-label" data-lang-key="stat_gyms">抱石場地</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">370+</div>
      <div class="stat-label" data-lang-key="stat_coaches">註冊教練</div>
    </div>
  </div>

  <div class="footer-note" data-lang-key="data_source">資料來源：《Hong Kong Rock》2023 · theCrag · 中國香港攀山及攀登總會</div>
</main>

<script>

        data_source: '資料來源：《Hong Kong Rock》2023 · theCrag · 中國香港攀山及攀登總會',

            { year: '2017', desc: '陳翔志奪得全運會男子抱石冠軍。' },
            { year: '2018', desc: '亞運會納入運動攀登速度賽，香港相繼建成多個速度賽場地。' },
            { year: '2019', desc: '香港主辦「香港抱石錦標賽」及「亞洲盃（抱石）」兩大賽事，陳翔志奪得男子公開組冠軍。' }

          '2020s': [

            { year: '2023', desc: '香港已有 25 個天然攀岩場地，超過 700 條路線。抱石場地數量持續增長，消費者委員會就安全問題發出指引。' },
            { year: '2025', desc: '香港抱石錦標賽於九龍公園舉行，陳翔志再度衛冕男子公開組冠軍。' }

      },
      en: {
        back_home: '← Back to Home',

        era_2010s: '2010s — Integration & Professionalisation',
        era_2020s: '2020s — New Era',

          '1950s': [

            { year: 'Late 1950s', desc: 'Written records of climbing activities began to appear.' }
          ],
          '1960s': [
            { year: '1968', desc: 'Sgt Steve Reeve of the RAF published Hong Kong\'s first climbing guidebook, sparking a climbing boom.' }
          ],
          '1970s': [
            { year: 'Early 1970s', desc: 'Outward Bound School established, including rock climbing as training, attracting more young people.' },
            { year: '1970s', desc: 'Indoor artificial climbing walls were invented in the Soviet Union; they reached Hong Kong nearly a decade later.' }
          ],
          '1980s': [
            { year: '1984', desc: 'Hong Kong Mountaineering Union (HKMU) founded as the local representative body.' },

          ],

            { year: '2018', desc: 'Speed climbing added to the Asian Games; Hong Kong built several speed walls.' },

          ],

            { year: '2020', desc: 'Sport climbing made its Olympic debut in Tokyo, further boosting the sport in Hong Kong.' },

            { year: '2023', desc: 'Hong Kong has 25 natural crags and over 700 routes. Bouldering venues continue to grow; the Consumer Council issued safety guidelines.' },

          ]

    };

    let currentLang = 'zh';

    // 渲染時間線
    function renderTimeline(lang) {
      const container = document.getElementById('timelineContainer');
      const dict = langDict[lang];
      const eventsData = dict.events;
      const eraOrder = ['1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
      
      let html = '';
      for (let era of eraOrder) {
        if (!eventsData[era]) continue;
        const eraTitle = dict[`era_${era}`] || era;
        html += `<div class="era">${eraTitle}</div>`;
        
        eventsData[era].forEach(ev => {
          html += `
            <div class="event-card">
              <div class="event-year">${ev.year} <small>${lang === 'zh' ? '' : ''}</small></div>
              <div class="event-desc">${ev.desc}</div>
            </div>
          `;
        });
      }
      container.innerHTML = html;
    }

    // 應用語言至所有帶 data-lang-key 的元素
    function applyLanguage(lang) {
      document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.getAttribute('data-lang-key');
        if (langDict[lang] && langDict[lang][key]) {
          el.textContent = langDict[lang][key];
        }
      });
      // 重新繪製時間線
      renderTimeline(lang);
      // 更新body class (可選)
      document.body.className = `lang-${lang}`;
      currentLang = lang;
    }

    // 語言切換
    const langToggle = document.getElementById('langToggle');
    langToggle.addEventListener('click', () => {
      const newLang = currentLang === 'zh' ? 'en' : 'zh';
      applyLanguage(newLang);
      langToggle.textContent = newLang === 'zh' ? '中 / EN' : 'EN / 中';
    });

    // 初始化 (預設中文)
    applyLanguage('zh');

    // 調整返回主頁鏈接確保路徑正確 (已寫在href)
  })();
</script>

</body>
</html>
